[project]
name = "geka-backend"
version = "0.1.0"
description = "Grounded Enterprise Knowledge Assistant backend"
authors = [
    {name = "Silvia Kocsis"}
]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.2.2",
    "fastapi==0.141.1",
    "uvicorn",
    "pypdf==6.19.0",
    "sentence-transformers==6.1.0",
    "chromadb==1.5.9",
    "onnxruntime==1.23.2"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
